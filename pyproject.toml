[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotline-agent"
version = "1.0.0"
description = "Hotline Agent Python / FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "langchain==1.4.7",
    "langchain-openai==1.7.3",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "mysql-connector-python>=9.0",
    "redis>=5.0",
    "minio>=7.2",
    "psycopg[binary]>=3.2",
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "nacos-sdk-python==3.2.0",
]

[tool.setuptools]
# 顶层还有 main.py 与 skill-center/，包目录只有 python_backend。
packages = ["python_backend"]

[tool.uv]
package = false
